name: daily-ingest

on:
  schedule:
    # JST 10,12,14,16,18,20 -> UTC 01,03,05,07,09,11
    - cron: "0 1,3,5,7,9,11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lxml pyarrow

      - name: Compute JST date (hd)
        id: hd
        run: |
          HD=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "hd=$HD" >> $GITHUB_OUTPUT

      - name: Fetch LZH (today)
        run: |
          python scripts/fetch_lzh.py --start ${{ steps.hd.outputs.hd }} --end ${{ steps.hd.outputs.hd }} --out raw

      - name: Fetch HTML snapshots (today)
        run: |
          python scripts/fetch_html.py --hd ${{ steps.hd.outputs.hd }} --out raw

      - name: Normalize curated (today)
        run: |
          python scripts/normalize.py --hd ${{ steps.hd.outputs.hd }} --raw raw --curated curated

      - name: Commit curated
        run: |
          git config user.name "boatrace-bot"
          git config user.email "boatrace-bot@users.noreply.github.com"
          git add curated
          if git diff --cached --quiet; then
            echo "No curated changes."
          else
            git commit -m "curated: update ${{ steps.hd.outputs.hd }}"
            git push
          fi

      - name: Upload raw artifacts (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: raw_${{ steps.hd.outputs.hd }}_${{ github.run_id }}
          path: raw
          retention-days: 7
